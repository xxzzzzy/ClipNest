name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        shell: pwsh
        run: .\build.ps1

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ClipNest-windows-x64
          path: x64/Release/ClipNest.exe
          if-no-files-found: error
